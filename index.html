<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>이지플라톤 시간표 v20</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#161d33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="이지플라톤">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f5f3ee;color:#2c2c2c;font-size:13px;}
button{cursor:pointer;font-family:inherit;transition:all .15s;}
input,textarea,select{font-family:inherit;}
textarea{resize:vertical;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:#ede8df;}
::-webkit-scrollbar-thumb{background:#c8bfb0;border-radius:4px;}
#app{min-height:100vh;}
header{background:linear-gradient(135deg,#161d33,#0e1424);border-bottom:none;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 3px 16px rgba(0,0,0,.25);position:relative;}
header::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;background:#e0a020;border-radius:0 3px 3px 0;}
.logo-wrap{display:flex;flex-direction:column;gap:2px;padding-left:16px;}
.logo{color:#fff;font-weight:900;font-size:20px;letter-spacing:-.5px;}
.logo-sub{color:#8892a8;font-size:11px;font-weight:600;letter-spacing:1px;}
.ver-badge{font-size:10px;color:#b8872a;background:#fdf3de;border:1px solid #e8cc88;border-radius:4px;padding:1px 7px;font-weight:700;margin-left:6px;}
.hdr-pill-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.hdr-pill{display:inline-flex;align-items:center;gap:6px;height:30px;box-sizing:border-box;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:0 5px 0 11px;color:#e4e8f2;font-size:11px;font-weight:700;cursor:pointer;transition:background .15s;}
.hdr-pill:hover{background:rgba(255,255,255,.09);}
.hdr-pill .pv{border-radius:999px;padding:2px 8px;font-weight:900;font-size:10.5px;color:#fff;line-height:1;}
.hdr-pill.blue{border-color:#3d6fd1;}
.hdr-pill.blue .pv{background:#3d6fd1;}
.hdr-pill.green{border-color:#2f8f5c;}
.hdr-pill.green .pv{background:#2f8f5c;}
.hdr-pill.amber{border-color:#c06020;}
.hdr-pill.special{border-color:#0d7d6b;}
.hdr-pill.special .pv{background:#0d7d6b;}
.hdr-pill.amber .pv{background:#c06020;}
main{padding:20px 28px;display:flex;flex-direction:column;gap:18px;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;}
.kpi-card{border-radius:11px;padding:9px 12px;position:relative;overflow:hidden;}
.kpi-card.dark{background:linear-gradient(135deg,#1b2540,#141b30);color:#fff;box-shadow:0 4px 14px rgba(20,30,60,.25);}
.kpi-card.light{background:#ffffff;border:1px solid #ddd8c8;}
.kpi-lbl{font-size:13px;font-weight:700;opacity:.8;margin-bottom:3px;}
.kpi-card.light .kpi-lbl{color:#8a8272;}
.kpi-val{font-size:28px;font-weight:900;line-height:1.1;}
.kpi-card.dark .kpi-val{color:#fff;}
.kpi-sub{font-size:12px;opacity:.7;margin-top:3px;}
.kpi-bar-track{height:5px;background:rgba(0,0,0,.08);border-radius:4px;margin-top:6px;overflow:hidden;}
.kpi-card.dark .kpi-bar-track{background:rgba(255,255,255,.15);}
.kpi-bar-fill{height:100%;border-radius:4px;}
.tab-nav{display:flex;gap:4px;background:#ffffff;border-radius:12px;padding:5px;border:1px solid #ddd8c8;box-shadow:0 2px 8px rgba(90,70,20,.1);width:fit-content;}
.tab-btn{padding:8px 20px;border-radius:9px;font-weight:700;font-size:13px;border:none;background:transparent;color:#a49b84;cursor:pointer;}
.tab-btn.active{background:#a3791f;color:#fff;box-shadow:0 2px 8px rgba(163,121,31,.3);}
.tab-btn:not(.active):hover{background:#e9dcb8;color:#a3791f;}
.card{background:#ffffff;border:1px solid #ddd8c8;border-radius:14px;overflow:hidden;box-shadow:0 2px 16px rgba(90,70,20,.1);}
.card-head{padding:13px 20px;border-bottom:1px solid #e5e0d3;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;background:linear-gradient(90deg,#f5f3ee,#ffffff);}
.card-title{font-weight:800;color:#a3791f;font-size:14px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;border-radius:9px;font-weight:700;font-size:12px;border:none;outline:none;cursor:pointer;transition:all .15s;}
.btn-primary{background:#a3791f;color:#fff;box-shadow:0 2px 8px rgba(163,121,31,.25);}
.btn-primary:hover{background:#8a6419;}
.btn-ghost{background:#f5f3ee;color:#a3791f;border:1px solid #ddd5c0;}
.btn-ghost:hover{background:#ece6d5;}
.btn-green{background:#dcece0;color:#2a6a44;border:1px solid #90bc9c;}
.btn-green:hover{background:#c9e2d0;}
.tt-wrap{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 260px);}
table.tt{border-collapse:separate;border-spacing:0;min-width:700px;width:100%;}
table.tt th,table.tt td{border:0.5px solid #e5e0d3;background-clip:padding-box;}
table.tt thead th{background:#1b2540;font-weight:800;font-size:13px;letter-spacing:2px;padding:10px;text-align:center;color:#cfd6ea;position:sticky;top:0;z-index:15;}
table.tt .time-col{background:#f5f3ee;text-align:right;padding:0 8px;font-size:17px;font-weight:800;color:#8a8272;white-space:nowrap;vertical-align:middle;width:60px;}
table.tt .ap-col{text-align:center;font-weight:900;font-size:10px;writing-mode:vertical-rl;letter-spacing:4px;padding:3px 2px;width:18px;}
table.tt .empty-cell{background:#fafaf7;cursor:pointer;min-width:100px;}
table.tt .empty-cell:hover{background:#ece6d5;}
table.tt .slot-cell{cursor:default;min-width:100px;padding:7px 9px;vertical-align:top;}
.slot-grade{font-size:18px;font-weight:800;margin-bottom:3px;line-height:1.4;cursor:pointer;opacity:.9;}
.slot-name{display:inline-block;font-size:16px;font-weight:700;line-height:1.8;cursor:pointer;padding:1px 6px;border-radius:4px;}
.leg-badge{border-radius:5px;padding:2px 9px;font-size:11px;font-weight:700;}
table.tt tbody tr:hover td.time-col{background:#ece6d5;color:#a3791f;font-weight:900;}
table.stat{width:100%;border-collapse:collapse;font-size:12px;}
table.stat th,table.stat td{border:1px solid #e5e0d3;padding:10px 14px;}
table.stat thead th{background:#1b2540;color:#cfd6ea;font-weight:700;}
table.stat tbody tr:hover{background:#f5f3ee;}
table.stat tfoot td{background:#f0ece0;font-weight:800;}
.fee-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.fee-group{display:flex;flex-direction:column;gap:14px;}
.fee-card{background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.fee-card-head{padding:11px 15px;display:flex;justify-content:space-between;align-items:center;}
.fee-card-body{padding:11px 15px;display:flex;flex-direction:column;gap:9px;}
.st-chip{border-radius:8px;padding:5px 10px;font-size:12px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;transition:filter .12s;}
.st-chip:hover{filter:brightness(.93);}
table.att-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;}
table.att-tbl th,table.att-tbl td{border:1px solid #e5e0d3;padding:6px 3px;text-align:center;}
table.att-tbl thead th{background:#1b2540;font-weight:700;color:#cfd6ea;position:sticky;z-index:20;}
table.att-tbl tbody tr:hover{background:#f5f3ee;}
.overlay{position:fixed;inset:0;background:rgba(20,15,5,.5);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.modal{background:#ffffff;border-radius:18px;padding:28px;max-height:90vh;overflow-y:auto;box-shadow:0 16px 56px rgba(30,20,5,.3);border:1px solid #e5e0d3;}
.modal-title{font-weight:800;font-size:15px;margin-bottom:16px;color:#a3791f;display:flex;align-items:center;gap:7px;}
.field-label{font-size:11px;color:#8a8272;font-weight:700;margin-bottom:5px;letter-spacing:.5px;display:block;}
.field-input{width:100%;border:1px solid #ddd8c8;border-radius:9px;padding:8px 12px;font-size:13px;outline:none;background:#f5f3ee;color:#2c2c2c;transition:border-color .1s;}
.field-input:focus{border-color:#a3791f;background:#ffffff;}
.cat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
.cat-btn{padding:7px 6px;border-radius:8px;font-size:11px;text-align:center;cursor:pointer;border-width:1.5px;border-style:solid;}
.span-row{display:flex;gap:4px;}
.span-btn{flex:1;padding:8px 0;border-radius:8px;font-size:10px;cursor:pointer;border-width:1.5px;border-style:solid;}
.fee-calc-card{border-radius:10px;padding:10px 13px;margin-bottom:6px;border-width:1.5px;border-style:solid;}
.modal-row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.month-nav{display:flex;align-items:center;gap:10px;}
.month-lbl{font-weight:800;font-size:14px;color:#665f4d;min-width:70px;text-align:center;}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;}
.chart-box{position:relative;height:190px;}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 20px;border-top:1px solid #e5e0d3;}
.summary-item{text-align:center;background:#f5f3ee;border-radius:10px;padding:14px 0;}
.summary-val{font-size:20px;font-weight:900;color:#a3791f;}
.summary-sub{font-size:11px;color:#aaa;margin-top:3px;}
.save-badge{font-size:11px;border-radius:6px;padding:3px 9px;}
@media print{
  @page{size:A4 landscape;margin:8mm;}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;}
  header .hdr-right,.tab-nav,.no-print{display:none!important;}
  header{background:#fff!important;box-shadow:none!important;padding:0 0 8px 0!important;}
  header::before{display:none!important;}
  .logo{color:#000!important;font-size:16px!important;}
  .logo-sub,header span{color:#333!important;}
  .card{box-shadow:none!important;border:1px solid #ccc!important;}
  body{background:#fff!important;}
  .fee-grid{grid-template-columns:repeat(2,1fr)!important;}
  main{padding:0!important;gap:0!important;}
  .card-head{padding:6px 10px!important;}
  .tt-wrap{overflow:visible!important;}
  table.tt{min-width:0!important;width:100%!important;table-layout:fixed!important;font-size:9px!important;border-collapse:separate!important;border-spacing:0!important;}
  table.tt tr{height:auto!important;}
  table.tt th,table.tt td{padding:1px 2px!important;border:0.5px solid #d8cfb4!important;background-clip:padding-box!important;}
  table.tt .slot-cell{padding:2px 3px!important;}
  table.tt .time-col{font-size:8px!important;}
  .slot-grade{font-size:6.5px!important;margin-bottom:1px!important;}
  .slot-name{font-size:8px!important;line-height:1.3!important;padding:0 2px!important;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── 상수 ─────────────────────────────────────────────────
const CATS=[
  {key:"초등_플라톤",label:"초등 플라톤",sub:"플라톤"},
  {key:"초등_이지",  label:"초등 이지",  sub:"이지"},
  {key:"중등_플라톤",label:"중등 플라톤",sub:"플라톤"},
  {key:"중등_이지",  label:"중등 이지",  sub:"이지"},
  {key:"중등_이지수능",label:"중등 이지수능",sub:"이지수능"},
  {key:"고등_이지수능",label:"고등 이지수능",sub:"이지수능"},
  {key:"고등_개인",  label:"고등 개인",  sub:"개인"},
];
const BFD_INIT={초등_플라톤:61600,초등_이지:75000,중등_플라톤:112000,중등_이지:140000,중등_이지수능:140000,고등_이지수능:160000,고등_개인:350000};
// 초등 플라톤은 학년별로 교습비가 다르다 (1~3학년은 동일, 4/5/6학년은 각각 별도 단가)
// 단가 자체(fee)는 S.elemPlatonFees에 저장해서 Firebase로 동기화되고, 여기 defaultFee는 최초 1회 초기값일 뿐이다.
const ELEM_PLATON_TIERS=[
  {key:"1-3",label:"초1~3학년",min:1,max:3,defaultFee:61600},
  {key:"4",  label:"초4학년",  min:4,max:4,defaultFee:65100},
  {key:"5",  label:"초5학년",  min:5,max:5,defaultFee:68600},
  {key:"6",  label:"초6학년",  min:6,max:6,defaultFee:72100},
];
const ELEM_PLATON_FEE_INIT={};ELEM_PLATON_TIERS.forEach(t=>ELEM_PLATON_FEE_INIT[t.key]=t.defaultFee);
// "학년" 텍스트(예: "초3","초 3학년" 등)에서 숫자만 추출
function parseGradeNum(gradeStr){
  const m=(gradeStr||"").match(/(\d+)/);
  return m?parseInt(m[1],10):null;
}
// 초등 플라톤 학년별 단가 구간(정의) 찾기 (학년 미상/1~3학년이면 1~3학년 구간 기본 적용)
function getElemPlatonTierDef(gradeStr){
  const n=parseGradeNum(gradeStr);
  if(n!=null){
    const found=ELEM_PLATON_TIERS.find(t=>n>=t.min&&n<=t.max);
    if(found)return found;
  }
  return ELEM_PLATON_TIERS[0];
}
// 초등 플라톤 학년별 "현재" 단가 (S.elemPlatonFees 우선, 없으면 기본값)
function getElemPlatonFee(gradeStr){
  const tier=getElemPlatonTierDef(gradeStr);
  const cur=S.elemPlatonFees&&S.elemPlatonFees[tier.key];
  return cur!==undefined?cur:tier.defaultFee;
}
// 분류(+학년)에 따른 기본 교습비. 초등_플라톤만 학년별로 갈리고 나머지는 store.bf[cat] 그대로.
function getBaseFee(store,cat,gradeStr){
  if(cat==="초등_플라톤")return getElemPlatonFee(gradeStr);
  return store.bf[cat]||0;
}
// 학생별로 저장된 "개별 교습비 오버라이드"를 분류별로 정확히 조회한다.
// 신규 저장은 meta.feeByCat[cat]에 분류별로 따로 저장되고, 과거의 단일값 meta.fee는
// 그 학생이 분류를 1개만 듣는 경우에만 안전하게 적용한다(여러 분류를 들으면 어느 분류 것인지
// 알 수 없어 서로 섞여버리는 문제가 있었으므로, 그 경우는 기본단가로 대체한다).
function getMetaFeeOverride(store,name,cat){
  const m=store.meta[name];
  if(!m)return undefined;
  if(m.feeByCat&&m.feeByCat[cat]!==undefined)return Number(m.feeByCat[cat]);
  if(m.fee!==undefined){
    let multiCat=false;
    if(typeof getStudentCategoryDays==="function"){
      const catDays=getStudentCategoryDays(name);
      multiCat=Object.keys(catDays).length>1;
    }
    if(!multiCat)return Number(m.fee);
  }
  return undefined;
}
// 분류별 기본 수업 길이 (span: 1=30분,2=1시간,3=1.5시간,4=2시간)
const DEFAULT_SPAN={초등_이지:"3",중등_플라톤:"3",중등_이지:"4",고등_개인:"4"};
const CC={
  초등_플라톤:{t:"#3a6ea8",bg:"#dce8f8",bd:"#9cc0ec",li:"#edf4fc"},
  초등_이지:  {t:"#5a95cc",bg:"#e4f1ff",bd:"#a8d0f0",li:"#f0f8ff"},
  중등_플라톤:{t:"#2a4d8f",bg:"#d6e0f5",bd:"#8aa4dc",li:"#eef2fb"},
  중등_이지:  {t:"#3a9a5c",bg:"#dcf2e8",bd:"#90d4ac",li:"#ebfaf3"},
  중등_이지수능:{t:"#2a7a4a",bg:"#cceadc",bd:"#80c8a0",li:"#e5f7ee"},
  고등_이지수능:{t:"#c06020",bg:"#fce4d0",bd:"#f0a870",li:"#fff0e4"},
  고등_개인:  {t:"#9a48a8",bg:"#f2e4f8",bd:"#d490d8",li:"#faeeff"},
};
const CATS2=[
  {key:"역사특강_34",label:"역사특강(3·4학년)",sub:"역사"},
  {key:"역사특강_56",label:"역사특강(5·6학년)",sub:"역사"},
  {key:"요점정리특강",label:"요점정리특강(5·6학년)",sub:"요점정리"},
  {key:"어휘력특강",  label:"어휘력특강(1·2학년)",sub:"어휘력"},
  {key:"중등특강",    label:"중등특강",sub:"중등"},
];
const BFD2_INIT={역사특강_34:0,역사특강_56:0,요점정리특강:0,어휘력특강:0,중등특강:0};
const ROUNDS=[{key:"1",label:"1회차(1·2주)",short:"1회차"},{key:"2",label:"2회차(3·4주)",short:"2회차"}];
const ROUND_MAP={};ROUNDS.forEach(r=>ROUND_MAP[r.key]=r);
const ROUND_COLOR={"1":{t:"#2f6fed",bg:"#dce7fb"},"2":{t:"#c0501f",bg:"#fbe3d3"}};
const CC2={
  역사특강_34:{t:"#b03868",bg:"#f8dce8",bd:"#e896b8",li:"#fdeef4"},
  역사특강_56:{t:"#9a2a58",bg:"#f5ccd8",bd:"#df84a4",li:"#faeaf0"},
  요점정리특강:{t:"#c07020",bg:"#fce4c8",bd:"#f0b070",li:"#fff2e0"},
  어휘력특강:  {t:"#3a6ea8",bg:"#dce8f8",bd:"#9cc0ec",li:"#edf4fc"},
  중등특강:    {t:"#3a9a5c",bg:"#dcf2e8",bd:"#90d4ac",li:"#ebfaf3"},
};
const LEVEL_MAP={초등_플라톤:"초등",초등_이지:"초등",중등_플라톤:"중등",중등_이지:"중등",중등_이지수능:"중등",고등_이지수능:"고등",고등_개인:"고등"};
// 통계 차트(교습비 비중/교습시간)에서만 쓰는 차분한 톤 팔레트 - 앱 전체의 진한 카테고리색과 별개
const CHART_MUTED_COLORS={
  초등_플라톤:{t:"#6b8caf",bg:"#dbe4ed"},
  초등_이지:{t:"#8aa8c2",bg:"#e4ebf1"},
  중등_플라톤:{t:"#7d8fb0",bg:"#e0e3ec"},
  중등_이지:{t:"#7fa08c",bg:"#e0eae3"},
  중등_이지수능:{t:"#6f9880",bg:"#dcebe2"},
  고등_이지수능:{t:"#b8927a",bg:"#ece2da"},
  고등_개인:{t:"#a389a8",bg:"#e8dee8"},

function repairDuplicateIds(){
  const seen=new Set();
  S.sch=S.sch.map(s=>{

    seen.add(s.id);return s;
  });
  const seen2=new Set();
  S.sch2=S.sch2.map(s=>{
    if(seen2.has(s.id))return{...s,id:nid2()};
    seen2.add(s.id);return s;
  });
  const seen3=new Set();
  S.makeup=(S.makeup||[]).map(mk=>{
    if(!mk.id||seen3.has(mk.id))return{...mk,id:nid3()};

function snapshotRevenue(){
  if(!S.revHistory)S.revHistory={};
  const rows=calcStudentsPerSlot();
  const total=rows.reduce((a,r)=>a+(r.free?0:r.fee),0);
  const todayKey=toISODate(new Date());
  // 가장 최근 스냅샷 값과 비교해서 달라졌을 때만 저장
  const histKeys=Object.keys(S.revHistory).sort();
  const lastVal=histKeys.length?S.revHistory[histKeys[histKeys.length-1]]:null;
  if(lastVal!==total){
    S.revHistory[todayKey]=total;
  }
}
// 정규(main) 학생들에게 걸려있던 개별 교습비(perStudent.fee, meta.fee)를 전부 걷어내서
// 이후로는 분류(+학년)별 기본 단가가 자동으로 적용되도록 한다. (무료 학생은 건드리지 않음)
// 반환값: 실제로 값이 바뀐 학생 수
function applyDefaultFeesToAllStudents(){
  let changed=0;
  S.sch=S.sch.map(slot=>{
    if(!slot.perStudent)return slot;
    const newPS={};
    Object.entries(slot.perStudent).forEach(([name,entry])=>{
      if(entry&&entry.fee!==undefined){
        const{fee,...rest}=entry;
        changed++;
        if(Object.keys(rest).length)newPS[name]=rest;
      } else if(entry){
        newPS[name]=entry;
      }
    });
    return{...slot,perStudent:newPS};
  });
  Object.keys(S.meta).forEach(name=>{
    const m=S.meta[name];
    if(m&&!m.free&&(m.fee!==undefined||m.feeByCat)){
      const{fee,feeByCat,...rest}=m;
      S.meta[name]=rest;
      changed++;
    }
  });
  snapshotRevenue();
  return changed;
}
function calcDailyRevenue(){
  if(!S.revHistory)S.revHistory={};
  const now=new Date();
  const todayKey=toISODate(now);
  snapshotRevenue();
  const start=new Date(2026,5,1); // 2026년 6월 1일 고정 시작
  const end=new Date(now.getFullYear(),now.getMonth()+2,0); // 현재+1개월의 말일까지
  const result=[];
  let lastVal=null;
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const dk=toISODate(d);
    const label=(d.getMonth()+1)+"/"+d.getDate();
    if(dk>todayKey){result.push({date:dk,label,total:null,isSnap:false});continue;}
    const isSnap=S.revHistory[dk]!==undefined;
    if(isSnap)lastVal=S.revHistory[dk];
    result.push({date:dk,label,total:lastVal,isSnap});
  }
  return result;
}

function scheduleAutoSave(){
  if(!db||isApplyingRemote||!firstSnapshotReceived)return;
  const cur=JSON.stringify(packData());
  if(cur===lastSavedJSON)return; // 변경 없음 → 재저장/재렌더 루프(=그래프 깜빡임) 방지
  S.saveStatus="⏳ 저장 대기 중...";updateSyncBadge();
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(async()=>{
    try{
      const payload=JSON.parse(cur);
      payload._writer=MY_ID;payload._ts=Date.now();
      await db.collection(FB_COL).doc(FB_DOC).set(payload);
      lastSavedJSON=cur;
      localSave();
      S.saveStatus="🟢 자동 동기화됨 "+new Date().toLocaleTimeString();
    }catch(e){console.error(e);S.saveStatus="❌ 자동 저장 실패";}
    updateSyncBadge();
  },1200);
}
// ── 실시간 동기화(다른 기기 변경 자동 반영) ────────────────
function setupRealtimeSync(){
  if(!db)return;
  db.collection(FB_COL).doc(FB_DOC).onSnapshot(doc=>{
    if(!doc.exists){
      firstSnapshotReceived=true;
      if(!S.loaded)render();
      return;
    }
    const data=doc.data();
    if(data._writer===MY_ID){
      // 내가 보낸 변경의 echo: 다시 그릴 필요 없음
      firstSnapshotReceived=true;
      return;
    }
    isApplyingRemote=true;
    applyData(data);
    lastSavedJSON=JSON.stringify(packData()); // 방금 받은 데이터를 기준점으로 설정 → 되돌려 보내지 않음
    firstSnapshotReceived=true;
    S.saveStatus="🟢 동기화됨 "+new Date().toLocaleTimeString();
    render();
    isApplyingRemote=false;
  },err=>{console.error(err);S.saveStatus="❌ 동기화 연결 실패";updateSyncBadge();});
}

// ── 특강(별도 시간표) 데이터 스토어 접근 ─────────────────────
// src="main": 기존 정규 시간표 / src="special": 특강 시간표 (완전히 별도 데이터)
// 출결 저장 키: 특강은 항상 이름+분류. 정규(main)는 그 학생이 분류를 2개 이상 들을 때만
// 이름+분류 조합으로 완전히 분리 저장한다(같은 요일에 두 분류가 겹쳐도 절대 안 섞이도록).
// 분류가 1개뿐인 학생은 기존처럼 이름 하나로 저장(기존 데이터 그대로 호환).
function attKey(src,name,cat){
  if(src==="special")return cat?name+"◆"+cat:name;
  if(cat){
    const catDays=getStudentCategoryDays(name);
    if(Object.keys(catDays).length>1)return name+"◆"+cat;
  }
  return name;
}
// 정규(main) 학생의 특정 분류(cat) 출결 기록을 반환한다. attKey가 이미 분류별로 완전히
// 분리된 키를 반환하므로, 그냥 그 키의 기록을 그대로 가져오면 된다(추가 필터링 불필요).
function getAttRecordForCat(name,cat){
  return S.att[attKey("main",name,cat)]||{};
}
// 앱 로드 시 1회 실행: 다중분류 학생의 기존(이름 하나로 저장된) 출결 기록을,
// "그 분류 수업이 있는 요일" 기준으로 새 분류별 키(이름◆분류)로 옮겨준다.
// 같은 요일에 두 분류가 겹치는 경우엔 판단 근거가 없어 두 분류 모두에 동일하게 복사된다
// (기존과 동일한 한계이나, 이후 새로 체크하는 기록부터는 분류별로 확실히 분리됨).
function migrateMultiCatAttendance(){
  const allNames=new Set();
  S.sch.forEach(slot=>(slot.names||[]).forEach(n=>allNames.add(n)));
  let migrated=0;
  allNames.forEach(name=>{
    const catDays=getStudentCategoryDays(name);
    const catKeys=Object.keys(catDays);
    if(catKeys.length<=1)return;
    const raw=S.att[name];
    if(!raw||S.attMigrated&&S.attMigrated[name])return;
    catKeys.forEach(cat=>{
      const days=catDays[cat];
      const composite=name+"◆"+cat;
      Object.entries(raw).forEach(([dk,v])=>{
        if(days.has(getDayOfWeekKR(dk))){
          if(!S.att[composite])S.att[composite]={};
          if(S.att[composite][dk]===undefined)S.att[composite][dk]=v;
        }
      });
    });
    if(!S.attMigrated)S.attMigrated={};
    S.attMigrated[name]=true;
    migrated++;
  });
  return migrated;
}

function calcStudents(src="main"){
  const store=getStore(src);
  const m={};
  store.sch.forEach(slot=>{
    (slot.names||[]).forEach(n=>{
      const ps=(slot.perStudent&&slot.perStudent[n])||{};
      const cat=ps.cat||slot.cat;
      if(!m[n])m[n]={name:n,slots:[]};
      m[n].slots.push({cat,fee:ps.fee,slotGrade:slot.grade,round:ps.round||"1"});
    });
  });
  return Object.values(m).map(s=>{
    const meta=store.meta[s.name]||{};
    const free=!!meta.free;
    const active=meta.active!==false;
    const pending=!free&&!active;
    const grade=meta.grade||s.slots[0]?.slotGrade||"";
    // 슬롯별로 집계 (특강은 같은 분류가 주 여러 회 반복돼도 1회 금액만 반영 — 패키지 총액 개념)
    let monthly=0;
    if(!free&&active){
      if(src==="special"){
        const seenCat={};
        s.slots.forEach(sl=>{
          const key=sl.cat+"|"+(sl.round||"1");
          if(seenCat[key])return;
          seenCat[key]=true;
          const fee=sl.fee!==undefined?sl.fee:(getMetaFeeOverride(store,s.name,sl.cat)!==undefined?getMetaFeeOverride(store,s.name,sl.cat):(store.bf[sl.cat]||0));
          monthly+=fee;
        });
      } else {
        monthly=s.slots.reduce((a,sl)=>{
          const fee=sl.fee!==undefined?sl.fee:(getMetaFeeOverride(store,s.name,sl.cat)!==undefined?getMetaFeeOverride(store,s.name,sl.cat):getBaseFee(store,sl.cat,grade));
          return a+fee;
        },0);
      }
    }
    // 대표 분류: 가장 많이 등장하는 cat
    const catCount={};s.slots.forEach(sl=>{catCount[sl.cat]=(catCount[sl.cat]||0)+1;});
    const cat=Object.keys(catCount).sort((a,b)=>catCount[b]-catCount[a])[0]||store.cats[0].key;
    const fee=(free||!active)?0:(s.slots[0]?.fee!==undefined?s.slots[0].fee:(getMetaFeeOverride(store,s.name,cat)!==undefined?getMetaFeeOverride(store,s.name,cat):getBaseFee(store,cat,grade)));
    // 대표 회차: 1회차가 있으면 1회차 우선 (정렬/표시용)
    const round=s.slots.some(sl=>(sl.round||"1")==="1")?"1":"2";
    return{name:s.name,cat,grade,free,active,pending,wc:s.slots.length,fee,monthly,round,memo:meta.memo||"",regDate:meta.regDate||""};
  });
}
// ── 슬롯별 학생 분류/교습비 집계 (교습비 현황용) ─────────────
function calcStudentsPerSlot(src="main"){
  const store=getStore(src);
  const rows=[];
  store.sch.forEach(slot=>{
    (slot.names||[]).forEach(n=>{
      const ps=(slot.perStudent&&slot.perStudent[n])||{};
      const meta=store.meta[n]||{};
      const free=!!meta.free;
      const active=meta.active!==false;
      const pending=!free&&!active;
      const cat=ps.cat||slot.cat;
      const grade=meta.grade||slot.grade;
      const fee=(free||!active)?0:(ps.fee!==undefined?ps.fee:(getMetaFeeOverride(store,n,cat)!==undefined?getMetaFeeOverride(store,n,cat):getBaseFee(store,cat,grade)));
      rows.push({name:n,cat,grade,free,active,pending,fee,slotId:slot.id,round:ps.round||"1"});
    });
  });
  return rows;
}
// 정규 시간표 "이름+분류" 단위 집계: 한 학생이 여러 분류(예: 플라톤+이지)를 동시에 들어도
// 분류별로 각각 별도 집계된다. calcStudents()는 학생 1명당 "대표 분류" 하나만 골라 합산하기 때문에
// 여러 분류를 듣는 학생의 인원수·교습비가 상단 요약에서 누락/오집계되는 문제가 있어, 요약 카드류는
// 이 함수를 사용해야 한다.
function calcStudentsByCategory(src="main"){
  const rows=calcStudentsPerSlot(src);
  const agg={};
  rows.forEach(r=>{
    const key=r.name+"|"+r.cat;
    if(!agg[key])agg[key]={name:r.name,cat:r.cat,grade:r.grade,free:r.free,active:r.active,pending:r.pending,monthly:0,wc:0};
    agg[key].monthly+=r.free?0:r.fee;
    agg[key].wc++;
  });
  return Object.values(agg);
}
// 특강 "등록" 단위 집계: 같은 학생이라도 분류(과목)가 다르면 별도 등록으로 카운트,
// 같은 분류+회차 안에서 주 여러 회 반복되는 건 1건으로 합쳐서 반영 (패키지 총액 개념)
function calcSpecialEnrollments(){
  const rows=calcStudentsPerSlot("special");
  const agg={};
  rows.forEach(r=>{
    const key=r.name+"|"+r.cat+"|"+(r.round||"1");
    if(!agg[key])agg[key]={name:r.name,cat:r.cat,grade:r.grade,free:r.free,round:r.round||"1",wc:0,monthly:0,feeSet:false};
    agg[key].wc++;
    if(!agg[key].feeSet){agg[key].monthly=r.free?0:r.fee;agg[key].feeSet=true;}
  });
  return Object.values(agg);
}
function buildCellMaps(src="main"){
  const store=getStore(src);
  const cmap={},smap={};
  store.sch.forEach(s=>{
    if(!(s.names&&s.names.length))return;
    const k=`${s.time}_${s.day}`;
    if(!cmap[k])cmap[k]=s;
    if(s.span>1){const ti=AK.indexOf(s.time);for(let i=1;i<s.span;i++)if(AK[ti+i])smap[`${AK[ti+i]}_${s.day}`]=true;}
  });
  return{cmap,smap};
}

      if(st.free)return;
      const reg=S.meta[st.name]?.regDate;
      if(reg&&reg.slice(0,7)>ym)return;
      total+=st.monthly;
    });
    return{ym,label:Number(ym.split("-")[1])+"월",total};
  });
}
function calcCategoryHours(src="main"){
  const store=getStore(src);
  const hrs={};
  store.sch.forEach(slot=>{
    if(!slot.names||!slot.names.length)return;
    const h=(slot.span||2)/2;
    const perStudent=slot.perStudent||{};
    const hasPer=slot.names.some(n=>perStudent[n]?.cat&&perStudent[n].cat!==slot.cat);
    if(hasPer){
      // 학생별 분류가 다른 경우: 슬롯 시간을 학생 수로 나눠 각 분류에 배분
      slot.names.forEach(n=>{
        const cat=(perStudent[n]?.cat)||slot.cat;
        hrs[cat]=(hrs[cat]||0)+h/slot.names.length;
      });
    } else {
      // 모두 같은 분류: 슬롯 시간 그대로
      hrs[slot.cat]=(hrs[slot.cat]||0)+h;
    }
  });
  return hrs;
}

function getTodayInfo(offsetDays){
  const today=new Date();
  if(offsetDays)today.setDate(today.getDate()+offsetDays);
  const idx=today.getDay()===0?6:today.getDay()-1;
  return{dayName:DAYS[idx],dateKey:toISODate(today),today};
}
// 특강 기간(7/22~8/19) 중 오늘이 속한 회차 반환 (1회차:7/22~8/04, 2회차:8/05~8/19), 기간 밖이면 null
function getActiveSpecialRound(today){
  const y=today.getFullYear();
  const start=new Date(y,6,22),mid=new Date(y,7,4),end=new Date(y,7,19);
  const t=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  if(t<start||t>end)return null;
  return t<=mid?"1":"2";
}

const h=(tag,attrs,children=[])=>{
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k.startsWith("on")&&typeof v==="function")el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")el.className=v;
    else el.setAttribute(k,v);
  });
  children.forEach(c=>{
    if(c==null)return;
    el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
  });
  return el;
};

// 특강 교습비 단위 표기 (설정값은 그대로, 안내 문구만 추가)
// 학생이 정규 시간표에서 어떤 분류를 어떤 요일에 듣는지 매핑 (분류별 4회차를 나누기 위한 기준)
function getStudentCategoryDays(name){
  const map={};
  S.sch.forEach(slot=>{
    if(!(slot.names||[]).includes(name))return;
    const ps=(slot.perStudent&&slot.perStudent[name])||{};
    const cat=ps.cat||slot.cat;
    if(!map[cat])map[cat]=new Set();
    map[cat].add(slot.day);
  });
  return map;
}
function getDayOfWeekKR(dateStr){
  const idx=new Date(dateStr+"T00:00:00").getDay();
  return["일","월","화","수","목","금","토"][idx];
}
// ── 자동 결제 기산일 규칙 ──────────────────────────────────
// 초등_플라톤/중등_플라톤 분류는 선불 자동결제(매달 20일)이며, "전월 20일에 결제한 금액이
// 이번 달(현재 진행 중인 달력월) 4회분 수업료"인 구조다. 즉 오늘이 속한 달력월 전체(1일~말일)가
// 이미 결제 완료된 현재 사이클이며, 그 안에서 몇 회 출석했는지 확인하는 용도로만 카운트한다.
const AUTO_BASE_CATS=["초등_플라톤","중등_플라톤"];
function toISODate(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
// 날짜키(YYYY-MM-DD)에 n일을 더한 새 날짜키 반환 (음수도 가능)
function addDaysToKey(dateKey,n){
  const[y,m,d]=dateKey.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  dt.setDate(dt.getDate()+n);
  return toISODate(dt);
}
// 날짜키(YYYY-MM-DD)를 dayName/dateObj로 변환
function getDateInfoFromKey(dateKey){
  const[y,m,d]=dateKey.split("-").map(Number);
  const dateObj=new Date(y,m-1,d);
  const idx=dateObj.getDay()===0?6:dateObj.getDay()-1;
  return{dayName:DAYS[idx],dateKey,today:dateObj};
}
// 현재 결제주기(=이번 달력월) 범위: 1일 ~ 말일
function getCurrentCycleMonthRange(){
  const now=new Date();
  const start=toISODate(new Date(now.getFullYear(),now.getMonth(),1));
  const end=toISODate(new Date(now.getFullYear(),now.getMonth()+1,0));
  return{start,end};
}
// 다음 결제일(안내 표시용). 오늘이 20일 이전이면 이번달 20일, 이후면 다음달 20일.
function getNextAutoPaymentDate(){
  const now=new Date();
  const d=now.getDate();
  const target=d<20?new Date(now.getFullYear(),now.getMonth(),20):new Date(now.getFullYear(),now.getMonth()+1,20);
  return toISODate(target);
}
// 등록일 이후 출석(O)+보강(D) 횟수를 분류(요일 기준)별로 나눠서 집계
// 결제횟수 집계 기준일: AUTO_BASE_CATS 분류는 항상 이번 달력월 전체(1일~말일), 그 외 분류는
// '결제 기산일'을 별도로 설정했으면 그걸 우선 사용, 없으면 등록일 사용
function getPayBaseDate(name){
  const m=S.meta[name]||{};
  return m.payBaseDate||m.regDate||"";
}
function countSessionsPerCategory(name,regDate){
  const catDays=getStudentCategoryDays(name);
  const counts={};
  Object.keys(catDays).forEach(cat=>counts[cat]=0);
  const rec=S.att[name]||{};
  const monthRange=getCurrentCycleMonthRange();
  Object.entries(rec).forEach(([d,v])=>{
    if(!(v==="O"||v==="D"))return;
    const dow=getDayOfWeekKR(d);
    const matchedCat=Object.keys(catDays).find(cat=>catDays[cat].has(dow));
    if(!matchedCat)return;
    if(AUTO_BASE_CATS.includes(matchedCat)){
      if(d<monthRange.start||d>monthRange.end)return; // 이번 달력월(현재 결제주기) 안의 출석만 카운트
    } else {
      if(!regDate)return; // 기산일 미설정 시 집계 제외
      if(d<regDate)return;
    }
    counts[matchedCat]=(counts[matchedCat]||0)+1;
  });
  return counts;
}
// 분류별 결제 주기(threshold) = 주당 수업 횟수 × 4주(1개월). 주1회면 4회, 주2회면 8회 단위로 결제.
// ── 특강 결제 현황 (회차당 고정 4회 패키지 기준) ──────────────
function getSpecialStudentCats(name){
  const set=new Set();
  S.sch2.forEach(slot=>{
    if(!(slot.names||[]).includes(name))return;
    const ps=(slot.perStudent&&slot.perStudent[name])||{};
    set.add(ps.cat||slot.cat);
  });
  return[...set];
}
// 날짜 하나가 1회차(7/22~8/4)·2회차(8/5~8/19) 중 어디에 속하는지 판정 (기간 밖이면 null)
function getRoundForDate(dateStr){
  const d=new Date(dateStr+"T00:00:00");
  const y=d.getFullYear();
  const start=new Date(y,6,22),mid=new Date(y,7,4),end=new Date(y,7,19);
  if(d<start||d>end)return null;
  return d<=mid?"1":"2";
}
function countSpecialSessionsPerKey(name){
  const cats=getSpecialStudentCats(name);
  const counts={};
  cats.forEach(cat=>{
    const rec=S.att2[attKey("special",name,cat)]||{};
    Object.entries(rec).forEach(([d,v])=>{
      if(!(v==="O"||v==="D"))return;
      const round=(cat==="요점정리특강")?"1":(getRoundForDate(d)||"1");
      const key=cat+"|"+round;
      counts[key]=(counts[key]||0)+1;
    });
  });
  return counts;
}
// 특강은 회차(1회차/2회차)당 고정 4회가 한 패키지: [{cat,round,key,due,isDue}]
function specialPaymentStatus(name){
  const counts=countSpecialSessionsPerKey(name);
  const paidMap=(S.meta2[name]&&S.meta2[name].paidUpToByCat)||{};
  // 등록은 돼 있지만 아직 출석기록이 없는 (분류|회차) 조합도 0회차로 포함시킨다
  const enrolled=calcSpecialEnrollments().filter(e=>e.name===name);
  const allKeys=new Set(Object.keys(counts));
  enrolled.forEach(e=>allKeys.add(e.cat+"|"+(e.round||"1")));
  return[...allKeys].map(key=>{
    const idx=key.lastIndexOf("|");
    const cat=key.slice(0,idx),round=key.slice(idx+1);
    const total=counts[key]||0;
    const due=Math.max(0,total-(paidMap[key]||0));
    return{cat,round,key,total,due,isDue:due>4};
  });
}

function getPaymentThreshold(name,cat){
  const catDays=getStudentCategoryDays(name);
  const weekly=(catDays[cat]&&catDays[cat].size)||1;
  return weekly*4;
}
// 분류별로 결제 주기(threshold) 단위 결제 대상 목록 반환: [{cat,due,threshold}]
// AUTO_BASE_CATS(초등/중등 플라톤)는 선불 자동결제라 출석 기반 미납 추적 대상에서 제외
function paymentDueByCategory(name,regDate){
  const counts=countSessionsPerCategory(name,regDate);
  const paidMap=(S.meta[name]&&S.meta[name].paidUpToByCat)||{};
  const list=[];
  Object.entries(counts).forEach(([cat,total])=>{
    if(AUTO_BASE_CATS.includes(cat))return; // 선불 자동결제: 미납 개념 없음
    const threshold=getPaymentThreshold(name,cat);
    const unpaid=total-(paidMap[cat]||0);
    if(unpaid>threshold)list.push({cat,total,due:unpaid,threshold});
  });
  return list;
}
// 전체 분류(미납 여부 상관없이) 결제 상태 반환: [{cat,total,due,threshold,isDue}]
// AUTO_BASE_CATS(초등/중등 플라톤)는 선불 자동결제라 결과에서 제외 (미납 배너/카드 대상 아님)
function allPaymentStatusByCategory(name,regDate){
  const counts=countSessionsPerCategory(name,regDate);
  const paidMap=(S.meta[name]&&S.meta[name].paidUpToByCat)||{};
  return Object.entries(counts).filter(([cat])=>!AUTO_BASE_CATS.includes(cat)).map(([cat,total])=>{
    const threshold=getPaymentThreshold(name,cat);
    const due=Math.max(0,total-(paidMap[cat]||0));
    return{cat,total,due,threshold,isDue:due>threshold};
  });
}

function specialFeeUnitLabel(catKey){
  return catKey==="어휘력특강"?"1시간×4회":"2시간×4회";
}
function feeUnitText(src,catKey){
  return src==="special"?("원 ("+specialFeeUnitLabel(catKey)+")"):"원/회";
}

function openCellModal(time,day,src="main"){
  const store=getStore(src);
  const{cmap}=buildCellMaps(src);
  const slot=cmap[`${time}_${day}`];
  const isSpecial=src==="special";
  let ms={
    time,day,sid:slot?.id||null,
    grade:slot?.grade||"",cat:slot?.cat||store.cats[0].key,
    nt:(!isSpecial&&slot)?(slot.names||[]).join("\n"):"",
    nt1:(isSpecial&&slot)?(slot.names||[]).filter(n=>((slot.perStudent&&slot.perStudent[n]&&slot.perStudent[n].round)||"1")==="1").join("\n"):"",
    nt2:(isSpecial&&slot)?(slot.names||[]).filter(n=>(slot.perStudent&&slot.perStudent[n]&&slot.perStudent[n].round)==="2").join("\n"):"",
    span:String(slot?.span||DEFAULT_SPAN[slot?.cat||store.cats[0].key]||2),stInfos:[]
  };
  const buildOne=(n,cat,round)=>{
    const meta=store.meta[n]||{};const free=!!meta.free;
    const ps=(slot?.perStudent&&slot.perStudent[n])||{};
    const indCat=ps.cat||cat;
    const fee=free?0:(ps.fee!==undefined?ps.fee:(getMetaFeeOverride(store,n,indCat)!==undefined?getMetaFeeOverride(store,n,indCat):getBaseFee(store,indCat,ms.grade)));
    return{name:n,free,fee,cat:indCat,round:round||ps.round||"1"};
  };
  // 특강: 1회차/2회차 명단을 합쳐서 stInfos 구성 (박스 위치가 회차를 결정, 기존 개별설정은 유지)
  const combineSpecialNames=()=>{
    const list1=ms.nt1.split("\n").map(n=>n.trim()).filter(Boolean);
    const list2=ms.nt2.split("\n").map(n=>n.trim()).filter(Boolean);
    const seen=new Set();const out=[];
    list1.forEach(n=>{if(!seen.has(n)){seen.add(n);out.push({name:n,round:"1"});}});
    list2.forEach(n=>{if(!seen.has(n)){seen.add(n);out.push({name:n,round:"2"});}});
    return out;
  };
  const syncSpecialSI=(cat,cur)=>combineSpecialNames().map(({name:n,round})=>{
    const found=cur.find(i=>i.name===n);
    if(found)return{...found,round};
    return buildOne(n,cat,round);
  });
  const syncSI=(nt,cat,cur)=>nt.split("\n").map(n=>n.trim()).filter(Boolean).map(n=>cur.find(i=>i.name===n)||buildOne(n,cat));
  if(slot){
    ms.stInfos=isSpecial?syncSpecialSI(slot.cat,[]):slot.names.map(n=>buildOne(n,slot.cat));
  }

  const ov=mkOv(close);const modal=mkModal(520);
  function close(){ov.remove();}
      function confirm(){
    const names=isSpecial?ms.stInfos.map(si=>si.name):ms.nt.split("\n").map(n=>n.trim()).filter(Boolean);
    const sp=Math.max(1,parseInt(ms.span)||2);
    if(!names.length){store.setSch(store.sch.filter(s=>!(s.time===time&&s.day===day)));close();render();return;}
    // perStudent: 슬롯 기본 분류와 다른 경우만 저장
    const perStudent={};
    ms.stInfos.forEach(si=>{
      const entry={};
      if(si.cat!==ms.cat)entry.cat=si.cat;
      if(!si.free)entry.fee=si.fee;
      if(isSpecial)entry.round=si.round||"1";
      if(Object.keys(entry).length)perStudent[si.name]=entry;
    });
    if(ms.sid)store.setSch(store.sch.map(s=>s.id===ms.sid?{...s,names,grade:ms.grade,cat:ms.cat,span:sp,perStudent}:s));
    else store.setSch([...store.sch,{id:isSpecial?nid2():nid(),time,day,names,grade:ms.grade,cat:ms.cat,span:sp,perStudent}]);
    if(src==="main")snapshotRevenue();
    close();render();
  }
  function rebuild(){
    modal.innerHTML="";
    modal.appendChild(mkTitle("✏️",(isSpecial?"[특강] ":"")+time.replace(/[AP]M /,"")+" ("+day+"요일)"));
    modal.appendChild(fLbl("분류"));
    const cg=D({className:"cat-grid",style:{marginBottom:"14px"}});
    store.cats.forEach(c=>{const cc=store.cc[c.key],sel=ms.cat===c.key;
      cg.appendChild(Bt({className:"cat-btn",style:{borderColor:sel?cc.t:BORDER,background:sel?cc.bg:"#faf8f4",color:sel?cc.t:TS,fontWeight:sel?"800":"400"},
        onClick:()=>{
          ms.cat=c.key;
          if(!ms.sid&&DEFAULT_SPAN[c.key])ms.span=DEFAULT_SPAN[c.key];
          if(isSpecial&&c.key==="요점정리특강"&&ms.nt2.trim()){
            const l1=ms.nt1.split("\n").map(x=>x.trim()).filter(Boolean);
            const l2=ms.nt2.split("\n").map(x=>x.trim()).filter(Boolean);
            const merged=[...new Set([...l1,...l2])];
            ms.nt1=merged.join("\n");ms.nt2="";
          }
          ms.stInfos=(isSpecial?syncSpecialSI(c.key,ms.stInfos):syncSI(ms.nt,c.key,ms.stInfos)).map(si=>({...si,fee:si.free?0:getBaseFee(store,c.key,ms.grade)}));
          rebuild();
        }},[c.label]));
    });
    modal.appendChild(cg);
    const r2=D({style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"14px"}});
    const gd=D({},[fLbl("학년/반")]);
    const gi=Inp({className:"field-input",value:ms.grade,placeholder:isSpecial?"예) 3·4학년":"예) 초5, 중3"});
    gi.addEventListener("input",e=>ms.grade=e.target.value);gd.appendChild(gi);r2.appendChild(gd);
    const sd=D({},[fLbl("수업 길이")]);
    const sr=D({className:"span-row"});
    [{v:"1",l:"30분"},{v:"2",l:"1시간"},{v:"3",l:"1.5h"},{v:"4",l:"2시간"}].forEach(o=>{
      const sel=ms.span===o.v;
      sr.appendChild(Bt({className:"span-btn",style:{borderColor:sel?GOLD:BORDER,background:sel?"#f5edd8":"#f5f3ee",color:sel?GOLD:TS,fontWeight:sel?"800":"400"},
        onClick:()=>{ms.span=o.v;rebuild();}},[o.l]));
    });
    sd.appendChild(sr);r2.appendChild(sd);modal.appendChild(r2);
    if(isSpecial&&ms.cat==="요점정리특강"){
      modal.appendChild(fLbl("👤 학생 명단 (1~4주 전체 진행)"));
      const taAll=Ta({className:"field-input",rows:"3",placeholder:"김철수\n이영희",style:{marginBottom:"4px"}},[ms.nt1]);
      taAll.addEventListener("input",e=>{ms.nt1=e.target.value;ms.stInfos=syncSpecialSI(ms.cat,ms.stInfos);rebuildFee();});
      taAll.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.ctrlKey)confirm();if(e.key==="Escape")close();});
      modal.appendChild(taAll);
      modal.appendChild(D({style:{fontSize:"10px",color:"#ccc",marginBottom:"12px"}},["요점정리특강은 회차 구분 없이 1~4주 내내 진행됩니다 · Ctrl+Enter 저장"]));
    } else if(isSpecial){
      const rg=D({style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"4px"}});
      const box1=D({});
      box1.appendChild(fLbl("👤 1회차 학생 (1·2주)"));
      const ta1=Ta({className:"field-input",rows:"3",placeholder:"김철수\n이영희",style:{marginBottom:"4px"}},[ms.nt1]);
      ta1.addEventListener("input",e=>{ms.nt1=e.target.value;ms.stInfos=syncSpecialSI(ms.cat,ms.stInfos);rebuildFee();});
      ta1.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.ctrlKey)confirm();if(e.key==="Escape")close();});
      box1.appendChild(ta1);rg.appendChild(box1);
      const box2=D({});
      box2.appendChild(fLbl("👤 2회차 학생 (3·4주)"));
      const ta2=Ta({className:"field-input",rows:"3",placeholder:"박민수\n최지우",style:{marginBottom:"4px"}},[ms.nt2]);
      ta2.addEventListener("input",e=>{ms.nt2=e.target.value;ms.stInfos=syncSpecialSI(ms.cat,ms.stInfos);rebuildFee();});
      ta2.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.ctrlKey)confirm();if(e.key==="Escape")close();});
      box2.appendChild(ta2);rg.appendChild(box2);
      modal.appendChild(rg);
      modal.appendChild(D({style:{fontSize:"10px",color:"#ccc",marginBottom:"12px"}},["각 박스에 넣은 학생은 해당 회차로 자동 지정됩니다 · Ctrl+Enter 저장"]));
    } else {
      modal.appendChild(fLbl("학생 이름 (한 줄에 한 명)"));
      const ta=Ta({className:"field-input",rows:"3",placeholder:"김철수\n이영희",style:{marginBottom:"4px"}},[ms.nt]);
      ta.addEventListener("input",e=>{ms.nt=e.target.value;ms.stInfos=syncSI(ms.nt,ms.cat,ms.stInfos);rebuildFee();});

    const fc=D({});modal.appendChild(fc);

      fc.innerHTML="";
      if(!ms.stInfos.length)return;
      fc.appendChild(D({style:{fontSize:"11px",color:TS,fontWeight:"600",marginBottom:"7px"}},["📊 교습비 (회당)"]));

        card.appendChild(tr);
        // 개별 분류 선택

            onClick:()=>{
              ms.stInfos[i]={...ms.stInfos[i],cat:c.key,fee:si.free?0:(getMetaFeeOverride(store,si.name,c.key)!==undefined?getMetaFeeOverride(store,si.name,c.key):getBaseFee(store,c.key,ms.grade))};

          const fi=Inp({type:"number",value:String(si.fee),style:{width:"110px",border:`1px solid ${cc2.bd}`,borderRadius:"7px",padding:"5px 8px",fontSize:"13px",textAlign:"right",outline:"none",background:"#fff",fontWeight:"700"}});
          fi.addEventListener("input",e=>{

            if(lbl)lbl.textContent=v.toLocaleString()+feeUnitText(src,siCat);

    rebuildFee();
    const br=D({className:"modal-row"});
    br.appendChild(Bt({className:"btn btn-ghost",onClick:close},["취소"]));
    br.appendChild(Bt({className:"btn btn-primary",onClick:confirm},["✅ 확인"]));
    modal.appendChild(br);
  }
  rebuild();ov.appendChild(modal);document.body.appendChild(ov);
}

function openStudentModal(name,fbCat,fbGrade,src="main"){
  const store=getStore(src);
  const stList=calcStudents(src);
  const st=stList.find(s=>s.name===name);
  const initGrade=st?.grade||fbGrade||"";
  // 클릭해서 들어온 분류(fbCat, 예: 시간표의 특정 슬롯)를 "대표 분류"보다 우선시한다.
  // (대표 분류만 쓰면 여러 분류를 듣는 학생은 항상 같은 분류로만 열리는 문제가 있었음)
  const initCat=fbCat||st?.cat||store.cats[0].key;
  const initFeeOverride=getMetaFeeOverride(store,name,initCat);
  let ms={
    name,cat:initCat,
    grade:initGrade,
    free:st?.free||false,
    active:store.meta[name]?.active!==false,
    fv:String(initFeeOverride!==undefined?initFeeOverride:getBaseFee(store,initCat,initGrade)),
    regDate:store.meta[name]?.regDate||"",
    payBaseDate:store.meta[name]?.payBaseDate||"",
    activeTab:"info",
    infoEditTs:null,
    memoEditTs:null,
    attM:toYM(new Date()),
  };

  const ov=mkOv(close);const modal=mkModal(700);
  function close(){ov.remove();}
  function saveMeta(){
    const prevBase=store.meta[ms.name]?.payBaseDate||"";
    const baseChanged=src==="main"&&prevBase!==ms.payBaseDate;
    const prevMeta=store.meta[ms.name]||{};
    const feeByCat={...(prevMeta.feeByCat||{})};
    if(!ms.free)feeByCat[ms.cat]=Number(ms.fv);else delete feeByCat[ms.cat];
    store.meta[ms.name]={...prevMeta,cat:ms.cat,grade:ms.grade,free:ms.free,active:ms.active,feeByCat,regDate:ms.regDate,payBaseDate:ms.payBaseDate};
    if(baseChanged)store.meta[ms.name]={...store.meta[ms.name],paidUpToByCat:{}};
    if(src==="main")snapshotRevenue();
    close();render();
  }

  function build(){
    modal.innerHTML="";
    // 탭
    const tabRow=D({style:{display:"flex",gap:"6px",marginBottom:"18px"}});
    [{t:"info",l:"📋 기본정보"},{t:"memo",l:"📝 수업메모"},{t:"att",l:"📅 출결"}].forEach(({t,l})=>{

      let dueList=[];

        } else if(src==="special"){

        const cell=D({style:{textAlign:"center",borderRadius:"7px",padding:"5px 2px",background:v==="O"?"#dcf2e8":v==="X"?"#fce4e4":v==="D"?"#fef3de":"#fff",border:`1px solid ${v==="O"?"#90d4ac":v==="X"?"#f0a8a8":v==="D"?"#e8cc88":"#e5e0d3"}`,cursor:"pointer"}});

        cell.addEventListener("click",()=>{
          const ak3=attKey(src,name,ms.cat);
          if(!store.att[ak3])store.att[ak3]={};

          if(!cur)store.att[ak3][dk]="O";
          else if(cur==="O")store.att[ak3][dk]="X";

          build();
        });
        weekRow.appendChild(cell);col++;

      [{v:"O",c:"#3a9a5c",bg:"#dcf2e8",t:"출석"},{v:"X",c:"#d04040",bg:"#fce4e4",t:"결석"},{v:"D",c:"#e08020",bg:"#fef3de",t:"보강"}].forEach(item=>{

      });
      leg.appendChild(Sp({style:{color:"#ccc"}},["클릭: ·→O→X→D→삭제"]));
      modal.appendChild(leg);

      let O=0,X=0,Dv=0;
      for(let d=1;d<=days;d++){const dk=ms.attM+"-"+String(d).padStart(2,"0");const v=rec[dk];if(v==="O")O++;else if(v==="X")X++;else if(v==="D")Dv++;}
      const sr=D({style:{display:"flex",gap:"10px",padding:"10px 0",borderTop:"1px solid #e5e0d3"}});
      [{l:"출석",v:O,c:"#3a9a5c"},{l:"결석",v:X,c:"#d04040"},{l:"보강",v:Dv,c:"#e08020"},{l:"합계",v:O+X+Dv,c:GOLD}].forEach(item=>{
        sr.appendChild(D({style:{flex:"1",textAlign:"center",background:"#f5f3ee",borderRadius:"8px",padding:"8px 0"}},[

      });
      modal.appendChild(sr);

// ── 초/중/고 레벨별 상세 모달 ────────────────────────────
function openLevelModal(level){
  const uniqueCount=calcStudents().filter(s=>getStudentLevel(s)===level).length;
  // 슬롯 단위로 집계: 같은 학생이라도 분류(요일별 트랙)가 다르면 각각 별도 항목으로 보여준다.
  const perSlotRows=calcStudentsPerSlot();
  const agg={};
  perSlotRows.forEach(r=>{
    const key=r.name+"|"+r.cat;
    if(!agg[key])agg[key]={name:r.name,cat:r.cat,grade:r.grade,free:r.free,wc:0};
    agg[key].wc++;
  });
  const stList=Object.values(agg).filter(s=>getStudentLevel(s)===level);
  const ov=mkOv(()=>ov.remove());const modal=mkModal(500);
  modal.appendChild(mkTitle("👥",level+" 학생 현황 ("+uniqueCount+"명)"));
  if(!stList.length){
    modal.appendChild(D({style:{color:"#ccc",padding:"20px 0",textAlign:"center"}},["등록된 학생이 없습니다."]));
  } else {
    const gradeMap={};
    stList.forEach(s=>{const g=s.grade||"학년미상";if(!gradeMap[g])gradeMap[g]=[];gradeMap[g].push(s);});
    const grades=Object.keys(gradeMap).sort((a,b)=>{
      const na=parseInt(a.replace(/\D/g,""))||99,nb=parseInt(b.replace(/\D/g,""))||99;
      return na-nb;
    });
    grades.forEach(gr=>{
      const gStudents=gradeMap[gr];
      const gradeUniqueNames=new Set(gStudents.map(s=>s.name));
      const gradeSec=D({style:{marginBottom:"16px"}});
      gradeSec.appendChild(D({style:{fontWeight:"900",fontSize:"14px",color:TM,marginBottom:"8px",paddingBottom:"4px",borderBottom:`2px solid ${BORDER}`}},[gr+" ("+gradeUniqueNames.size+"명)"]));
      const catMap={};
      gStudents.forEach(s=>{if(!catMap[s.cat])catMap[s.cat]=[];catMap[s.cat].push(s);});
      CATS.filter(c=>catMap[c.key]).forEach(c=>{
        const lst=catMap[c.key];const cc=CC[c.key];
        const isPrepaid=AUTO_BASE_CATS.includes(c.key);
        // ── 표시 상태 미리 계산 ──
        // 선불(초등/중등 플라톤): 미납 개념이 없으므로 "이번 결제주기 출석 N/4회" 확인용 표시
        // 그 외 분류: 기존처럼 미납 여부(isDue)/미납 회차(dueTotal) 표시
        const withDue=lst.map(s=>{
          if(s.free)return{...s,isDue:false,dueTotal:0,prepaidTotal:0,prepaidThreshold:0};
          if(isPrepaid){
            const counts=countSessionsPerCategory(s.name);
            const total=counts[s.cat]||0;
            const threshold=getPaymentThreshold(s.name,s.cat);
            return{...s,isDue:false,dueTotal:0,prepaidTotal:total,prepaidThreshold:threshold};
          }
          const ps=allPaymentStatusByCategory(s.name,getPayBaseDate(s.name)).find(p=>p.cat===s.cat);
          return{...s,isDue:!!(ps&&ps.isDue),dueTotal:ps?ps.total:0,prepaidTotal:0,prepaidThreshold:0};
        });
        const dueCnt=withDue.filter(s=>s.isDue).length;
        const shortCnt=isPrepaid?withDue.filter(s=>!s.free&&s.prepaidTotal<s.prepaidThreshold).length:0;
        const sec=D({style:{marginBottom:"10px"}});
        const secHead=D({style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"6px"}});
        secHead.appendChild(Sp({style:{fontWeight:"800",fontSize:"12px",color:cc.t}},[c.label+" ("+lst.length+"명"+(dueCnt?" · 미납 "+dueCnt+"명":"")+(shortCnt?" · 4회 미만 "+shortCnt+"명":"")+")"]));
        sec.appendChild(secHead);
        const chips=D({style:{display:"flex",flexWrap:"wrap",gap:"6px"}});
        withDue.forEach(s=>{
          const prepaidOk=isPrepaid&&!s.free&&s.prepaidTotal>=s.prepaidThreshold;
          const chip=D({className:"st-chip",style:{background:s.isDue?"#fff3d6":cc.li,border:`1.5px solid ${s.isDue?"#e8b448":cc.bd}`},onClick:()=>{ov.remove();openStudentModal(s.name,s.cat,s.grade);}});
          chip.appendChild(Sp({style:{color:s.isDue?"#8a6419":TM,fontWeight:"700"}},[s.name]));
          if(isPrepaid&&!s.free){
            chip.appendChild(Sp({style:{fontSize:"10px",marginLeft:"4px",fontWeight:"800",color:prepaidOk?"#2a8a50":"#a3791f",background:prepaidOk?"#dcf2e8":"#fff3d6",borderRadius:"4px",padding:"1px 5px"}},[s.prepaidTotal+"/"+s.prepaidThreshold+"회"+(prepaidOk?" ✓":"")]));
          } else if(s.isDue){
            chip.appendChild(Sp({style:{fontSize:"10px",color:"#8a6419",marginLeft:"4px",fontWeight:"800",background:"#ffe9b8",borderRadius:"4px",padding:"1px 5px"}},[s.dueTotal+"회차 미납"]));
          } else {
            chip.appendChild(Sp({style:{fontSize:"10px",color:TS,marginLeft:"2px"}},[s.grade+" · "+(s.free?"무료":"주"+s.wc+"회")]));
          }
          chips.appendChild(chip);
        });
        sec.appendChild(chips);
        gradeSec.appendChild(sec);
      });
      modal.appendChild(gradeSec);
    });
  }
  const br=D({className:"modal-row"});
  br.appendChild(Bt({className:"btn btn-primary",onClick:()=>ov.remove()},["닫기"]));
  modal.appendChild(br);
  ov.appendChild(modal);document.body.appendChild(ov);
}

// ── KPI 요약 카드 (대시보드 스타일) ─────────────────────────
function renderKpiSummary(src="main"){
  const cats=src==="special"?CATS2:CATS;
  const cc2map=src==="special"?CC2:CC;
  const stList=src==="special"?calcSpecialEnrollments():calcStudents(src); // 총원/무료 카운트용 (학생 1명당 1행)
  const byCatList=src==="special"?stList:calcStudentsByCategory(src); // 분류별 카운트·매출용 (여러 분류 수강 시 분류마다 별도 집계)
  const totalStudents=stList.length;
  const totalRevenue=byCatList.reduce((a,s)=>a+(s.free?0:s.monthly),0);
  const wrap=D({style:{display:"flex",flexDirection:"column",gap:"10px"}});

  // Row A: 학생수 현황
  const rowA=D({className:"kpi-row"});
  const cardA=D({className:"kpi-card dark"});
  cardA.appendChild(D({className:"kpi-lbl"},[src==="special"?"특강 총 학생":"총 재원생"]));
  cardA.appendChild(D({className:"kpi-val"},[totalStudents+"명"]));
  const freeCnt=stList.filter(s=>s.free).length;
  cardA.appendChild(D({className:"kpi-sub"},[freeCnt>0?"무료 "+freeCnt+"명 포함":"전원 유료"]));
  rowA.appendChild(cardA);
  const catCounts=cats.map(c=>({...c,cnt:byCatList.filter(s=>s.cat===c.key).length})).filter(c=>c.cnt>0);
  catCounts.forEach(c=>{
    const cc=cc2map[c.key];
    const pct=totalStudents>0?Math.round(c.cnt/totalStudents*100):0;
    const card=D({className:"kpi-card light"});
    card.appendChild(D({className:"kpi-lbl"},[c.label]));
    card.appendChild(D({className:"kpi-val",style:{color:cc.t,fontSize:"17px"}},[c.cnt+"명"]));
    const track=D({className:"kpi-bar-track"});
    track.appendChild(D({className:"kpi-bar-fill",style:{width:pct+"%",background:cc.t}}));
    card.appendChild(track);
    card.appendChild(D({className:"kpi-sub"},[pct+"%"]));
    rowA.appendChild(card);
  });
  wrap.appendChild(rowA);
  if(src==="main")wrap.appendChild(D({style:{fontSize:"10px",color:"#ccc",padding:"0 2px"}},["※ 총 재원생은 고유 인원, 분류별 카드는 수강생 기준(여러 분류를 동시에 듣는 학생은 각 분류에 중복 집계)"]));

  // Row B: 교습비 현황
  const rowB=D({className:"kpi-row"});
  const cardB=D({className:"kpi-card dark"});

// ── 탭: 출결 ────────────────────────────────────────────
// 분류 목록(catKeys)에 해당하는 학생들의 출결 표(그리드+학생행)를 만든다.
// gradeSplitCats에 포함된 분류는 학년별로 소그룹핑되고, 나머지는 분류 하나로 묶인다.
// 보강 예약(S.makeup)에는 있지만 정규 시간표(S.sch)엔 등록되지 않은 학생 목록
// (예: 임시로 보강만 받는 학생 등) - 출결현황 "전체" 그룹에서 별도로 보여주기 위함
function getMakeupOnlyStudents(){
  const enrolledNames=new Set(calcStudentsByCategory("main").map(s=>s.name));
  const seen=new Map();
  S.makeup.forEach(mk=>{
    (mk.names||[]).forEach(n=>{
      if(!enrolledNames.has(n)&&!seen.has(n))seen.set(n,{name:n,grade:mk.grade||""});
    });
  });
  return[...seen.values()];
}
function buildAttendanceTableEl(catKeys,src,gradeSplitCats,includeMakeupOnly){
  const store=getStore(src);
  const catsDef=src==="special"?CATS2:CATS;
  const stList=(src==="special"?calcSpecialEnrollments():calcStudentsByCategory("main")).filter(s=>catKeys.includes(s.cat));
  if(src==="special")stList.sort((a,b)=>(a.round||"1").localeCompare(b.round||"1"));
  const makeupOnly=(includeMakeupOnly&&src==="main")?getMakeupOnlyStudents():[];
  if(!stList.length&&!makeupOnly.length){
    return D({style:{color:"#ccc",padding:"24px",textAlign:"center",fontSize:"14px"}},[src==="special"?"등록된 특강 학생이 없습니다. 시간표 탭에서 '🏖 특강 시간표'로 전환해 추가해보세요.":"등록된 학생이 없습니다."]);
  }

  htr.appendChild(h("th",{style:{width:"70px"}},["분류"]));
  htr.appendChild(h("th",{style:{width:"110px"}},["출/결/보강"]));
  const days=daysInMonth(S.attMonth);const[yr,mo]=S.attMonth.split("-").map(Number);
  const dowNames=["일","월","화","수","목","금","토"];
  for(let d=1;d<=days;d++){
    const wd=new Date(yr,mo-1,d).getDay();
    const dk=S.attMonth+"-"+String(d).padStart(2,"0");
    const hol=HOLIDAYS[dk];
    const col=(hol||wd===0)?"#d04040":wd===6?"#3a6ea8":"#aaa";
    const bg=hol?"#fde4e4":wd===0?"#fdeded":wd===6?"#eaf1fb":"transparent";
    htr.appendChild(h("th",{style:{minWidth:"26px",fontSize:"12px",color:col,padding:"4px 1px",background:bg},title:hol||""},[
      D({},[String(d)]),
      D({style:{fontSize:"10px",fontWeight:"400",marginTop:"1px"}},[dowNames[wd]])
    ]));

  thead.appendChild(htr);tbl.appendChild(thead);
  const tbody=h("tbody",{});
  const colCount=days+3;
  let rowIndex=0;
  function buildGroupHeader(label,cc,count){
    const hr=h("tr",{});
    hr.appendChild(h("td",{colspan:String(colCount),style:{background:cc.bg,color:cc.t,fontWeight:"800",fontSize:"14px",padding:"7px 14px",textAlign:"left",borderTop:`2px solid ${cc.bd}`}},[label+" ("+count+"명)"]));
    tbody.appendChild(hr);
  }
  function buildStudentRow(st){
    const cc=st.isMakeupOnly?{t:"#c07020",bg:"#fce4c8",bd:"#f0b070"}:store.cc[st.cat];
    const ak=st.isMakeupOnly?st.name:attKey(src,st.name,st.cat);
    const rec=st.isMakeupOnly?(S.att[st.name]||{}):(src==="main"?getAttRecordForCat(st.name,st.cat):(store.att[ak]||{}));
    const tr=h("tr",{style:{background:rowIndex%2===0?"#fff":"#f5f3ee"}});
    rowIndex++;
    const ntd=h("td",{style:{paddingLeft:"14px",fontWeight:"700",cursor:"pointer",color:cc.t}});
    ntd.addEventListener("click",()=>openStudentModal(st.name,st.cat,st.grade,src));
    ntd.appendChild(Sp({style:{textDecoration:"underline dotted",textUnderlineOffset:"3px"}},[st.name]));
    if(src==="special"&&st.cat!=="요점정리특강")ntd.appendChild(Sp({style:{fontSize:"11px",color:"#fff",background:ROUND_COLOR[st.round||"1"].t,borderRadius:"3px",padding:"0 4px",marginLeft:"5px",fontWeight:"800"}},[ROUND_MAP[st.round||"1"].short]));
    tr.appendChild(ntd);
    tr.appendChild(h("td",{style:{textAlign:"center"}},[Sp({style:{background:cc.bg,color:cc.t,borderRadius:"5px",padding:"1px 6px",fontSize:"12px",fontWeight:"700"}},[st.isMakeupOnly?"보강":(store.cats.find(c=>c.key===st.cat)?.sub||"")])]));
    // 출/결/보강 횟수는 요일 셀보다 먼저 집계해서, 분류 바로 다음 칸에 배치한다
    let O=0,X=0,Dv=0;
    for(let d=1;d<=days;d++){
      const dk=S.attMonth+"-"+String(d).padStart(2,"0");const v=rec[dk];
      if(v==="O")O++;else if(v==="X")X++;else if(v==="D")Dv++;
    }
    const sumTd=h("td",{style:{textAlign:"center",fontSize:"14px",fontWeight:"700",whiteSpace:"nowrap"}});
    sumTd.appendChild(Sp({style:{color:"#3a9a5c"}},[O+"출 "]));
    sumTd.appendChild(Sp({style:{color:"#d04040"}},[X+"결 "]));
    sumTd.appendChild(Sp({style:{color:"#e08020"}},[Dv+"보"]));
    tr.appendChild(sumTd);
    for(let d=1;d<=days;d++){
      const dk=S.attMonth+"-"+String(d).padStart(2,"0");const v=rec[dk];

      const isOff=HOLIDAYS[dk]||wdc===0||wdc===6;
      const td=h("td",{style:{textAlign:"center",background:v==="O"?"#dcf2e8":v==="X"?"#fce4e4":v==="D"?"#fef3de":(isOff?"#f0ece0":""),padding:"4px 0",cursor:"pointer",fontSize:"14px",fontWeight:"800",color:v==="O"?"#3a9a5c":v==="X"?"#d04040":v==="D"?"#e08020":"#ddd"}});
      td.appendChild(document.createTextNode(v||"·"));
      td.addEventListener("click",()=>{
        if(!store.att[ak])store.att[ak]={};
        const cur=v;
        if(!cur)store.att[ak][dk]="O";else if(cur==="O")store.att[ak][dk]="X";else if(cur==="X")store.att[ak][dk]="D";else delete store.att[ak][dk];
        render();
      });
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  catsDef.filter(c=>catKeys.includes(c.key)).forEach(c=>{
    const inCat=stList.filter(s=>s.cat===c.key);
    if(!inCat.length)return;
    const cc=store.cc[c.key];
    if(gradeSplitCats.has(c.key)){
      const byGrade={};
      inCat.forEach(s=>{
        const n=parseGradeNum(s.grade);
        const gk=n!=null?n:99;
        if(!byGrade[gk])byGrade[gk]=[];

        const list=byGrade[gk].sort((a,b)=>a.name.localeCompare(b.name));
        const label=c.label+" · "+(gk===99?"학년미상":gk+"학년");

        list.forEach(buildStudentRow);

    } else {
      const list=inCat.slice().sort((a,b)=>src==="special"?0:a.name.localeCompare(b.name));
      buildGroupHeader(c.label,cc,list.length);
      list.forEach(buildStudentRow);
    }
  });
  if(makeupOnly.length){
    const mcc={t:"#c07020",bg:"#fce4c8",bd:"#f0b070"};
    buildGroupHeader("🔁 보강 전용 (정규 미등록)",mcc,makeupOnly.length);
    makeupOnly.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(s=>buildStudentRow({...s,cat:null,isMakeupOnly:true}));
  }
  tbl.appendChild(tbody);tblWrap.appendChild(tbl);
  return tblWrap;
}

const ATT_GROUPS=[
  {key:"all",label:"전체 출결현황",icon:"📋",cats:CATS.map(c=>c.key),gradeSplit:false,includeMakeupOnly:true},
  {key:"platon",label:"플라톤",icon:"🎓",cats:["초등_플라톤","중등_플라톤"],gradeSplit:true},
  {key:"easy_korean",label:"이지국어",icon:"📘",cats:["초등_이지","중등_이지"],gradeSplit:false},
  {key:"easy_suneung",label:"이지수능",icon:"📝",cats:["중등_이지수능","고등_이지수능"],gradeSplit:false},
  {key:"private",label:"개인",icon:"🎯",cats:["고등_개인"],gradeSplit:false},
];
function getAttGroupSummary(catKeys){
  const store=getStore("main");
  const rows=calcStudentsByCategory("main").filter(s=>catKeys.includes(s.cat));
  const revenue=rows.filter(s=>!s.free).reduce((a,s)=>a+s.monthly,0);
  const days=daysInMonth(S.attMonth);
  let O=0,X=0,Dv=0;
  rows.forEach(s=>{
    const rec=getAttRecordForCat(s.name,s.cat);
    for(let d=1;d<=days;d++){
      const v=rec[S.attMonth+"-"+String(d).padStart(2,"0")];
      if(v==="O")O++;else if(v==="X")X++;else if(v==="D")Dv++;
    }
  });
  return{count:rows.length,revenue,O,X,Dv};
}
// 분류별 카드 목록 (클릭하면 S.attGroup을 바꿔서 아래 내용이 화면전환되듯 바뀐다 - 팝업 아님)
function renderAttGroupCards(){
  const row=D({className:"no-print",style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(210px,1fr))",gap:"10px"}});
  ATT_GROUPS.forEach(group=>{
    const sum=getAttGroupSummary(group.cats);
    const active=S.attGroup===group.key;
    const card=D({style:{background:active?"#f5edd8":"#fff",border:`1.5px solid ${active?GOLD:BORDER}`,borderRadius:"12px",padding:"12px 14px",cursor:"pointer",boxShadow:active?"0 2px 10px rgba(163,121,31,.18)":"0 2px 8px rgba(90,70,20,.06)"},onClick:()=>{S.attGroup=group.key;render();}});
    card.appendChild(D({style:{fontWeight:"800",fontSize:"15px",color:active?GOLD:TM,marginBottom:"9px"}},[group.icon+" "+group.label]));
    const miniItem=(label,val,color,big)=>D({style:{textAlign:"center"}},[
      D({style:{fontSize:big?"21px":"15px",fontWeight:"900",color:color||TM,lineHeight:"1.1"}},[val]),
      D({style:{fontSize:"11px",color:"#aaa",marginTop:"2px",fontWeight:"700"}},[label])
    ]);
    const statGrid=D({style:{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:"4px",background:active?"rgba(255,255,255,.5)":"#f5f3ee",borderRadius:"8px",padding:"8px 2px"}});
    statGrid.appendChild(miniItem("수강생수",sum.count+"명",GOLD,true));
    statGrid.appendChild(miniItem("출석",sum.O+"회","#3a9a5c"));
    statGrid.appendChild(miniItem("결석",sum.X+"회","#d04040"));
    statGrid.appendChild(miniItem("보강",sum.Dv+"회","#e08020"));
    statGrid.appendChild(miniItem("금액",(sum.revenue/10000).toFixed(0)+"만",GOLD));
    card.appendChild(statGrid);
    row.appendChild(card);
  });
  return row;
}

  switchRow.appendChild(sw);

  if(isSpecialStat)wrap.appendChild(renderKpiSummary(chartSrc0));

  let barCanvas=null;
  if(!isSpecialStat){
    // 1단: 교습비 변동추이 (전체 폭)
    const barBox=D({className:"chart-box",style:{width:"100%",height:"380px"}});barCanvas=h("canvas",{});barBox.appendChild(barCanvas);chartCol.appendChild(barBox);
  }
  // 2단: 교습비 비중 + 주간 교습시간 (좌우 2열)
  const row2=D({style:{display:"flex",flexDirection:"row",gap:"10px"}});
  const feeBox=D({className:"chart-box",style:{flex:"1 1 0",minWidth:"260px"}});const feeCanvas=h("canvas",{});feeBox.appendChild(feeCanvas);row2.appendChild(feeBox);
  const hourBox=D({className:"chart-box",style:{flex:"1 1 0",minWidth:"260px"}});const hourCanvas=h("canvas",{});hourBox.appendChild(hourCanvas);row2.appendChild(hourBox);
  chartCol.appendChild(row2);
  if(isSpecialStat){
    chartCol.appendChild(D({style:{textAlign:"center",color:"#ccc",fontSize:"13px",padding:"10px 0"}},["※ 특강은 기간이 짧아 일별 변동 추이는 제공하지 않습니다."]));
  }
  chartCard.appendChild(chartCol);

  if(isSpecialStat){
    wrap.appendChild(renderCombinedStatCard());
    wrap.appendChild(chartCard);
  } else {
    // 왼쪽: 총재원생·예상교습비 요약 + 세부 학생현황(분류 클릭시 학년별 상세) / 오른쪽: 통계 차트(변동추이 먼저)
    const leftCard=D({className:"card"});
    const totalStList=calcStudents("main");
    const totalByCatList=calcStudentsByCategory("main");
    const totalStudents=totalStList.length;
    const totalEnrollments=totalByCatList.length;
    const totalRevenue=totalByCatList.reduce((a,s)=>a+(s.free?0:s.monthly),0);
    const freeCnt=totalStList.filter(s=>s.free).length;
    const topSumRow=D({style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px",padding:"12px"}});
    const cardA=D({className:"kpi-card dark"});
    cardA.appendChild(D({className:"kpi-lbl"},["총 재원생"]));
    cardA.appendChild(D({className:"kpi-val"},[totalStudents+"명"]));
    cardA.appendChild(D({className:"kpi-sub"},[freeCnt>0?"무료 "+freeCnt+"명":"전원 유료"]));
    topSumRow.appendChild(cardA);
    const cardA2=D({className:"kpi-card dark"});
    cardA2.appendChild(D({className:"kpi-lbl"},["총 수강생"]));
    cardA2.appendChild(D({className:"kpi-val"},[totalEnrollments+"명"]));
    cardA2.appendChild(D({className:"kpi-sub"},[totalEnrollments>totalStudents?"중복 "+(totalEnrollments-totalStudents)+"건":"중복 없음"]));
    topSumRow.appendChild(cardA2);
    const cardB=D({className:"kpi-card dark"});
    cardB.appendChild(D({className:"kpi-lbl"},["예상 교습비"]));
    cardB.appendChild(D({className:"kpi-val"},[(totalRevenue/10000).toFixed(0)+"만원"]));
    cardB.appendChild(D({className:"kpi-sub"},[totalRevenue.toLocaleString()+"원"]));
    topSumRow.appendChild(cardB);
    leftCard.appendChild(topSumRow);
    leftCard.appendChild(D({style:{fontSize:"10px",color:"#ccc",padding:"0 12px 8px"}},["※ 총 재원생은 고유 인원 기준, 아래 세부 학생현황은 분류별 수강생 기준(중복 집계 가능)"]));
    leftCard.appendChild(D({className:"card-head"},[Sp({className:"card-title"},["📋 세부 학생현황 (수강생 기준)"])]));
    leftCard.appendChild(buildCategorySummaryTableClickable());
    const twoCol=D({style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",alignItems:"start"}});
    twoCol.appendChild(leftCard);
    twoCol.appendChild(chartCard);
    wrap.appendChild(twoCol);
  }

  setTimeout(()=>{
    const now=new Date();
    const barLabelPlugin=(fmt)=>({
      id:'barLabel'+Math.random().toString(36).slice(2),
      afterDatasetsDraw(chart){
        const{ctx}=chart;
        chart.data.datasets.forEach((dataset,i)=>{
          const meta=chart.getDatasetMeta(i);
          const total=dataset.data.reduce((a,b)=>a+b,0);
          meta.data.forEach((bar,index)=>{
            const value=dataset.data[index];
            ctx.save();
            ctx.fillStyle="#2c2c2c";
            ctx.font="700 11px 'Apple SD Gothic Neo',sans-serif";
            ctx.textAlign="left";
            ctx.textBaseline="middle";
            ctx.fillText(fmt(value,total),bar.x+6,bar.y);
            ctx.restore();
          });
        });
      }
    });
    const lineLabelPlugin={
      id:'lineLabel',
      afterDatasetsDraw(chart){
        const{ctx}=chart;
        chart.data.datasets.forEach((dataset)=>{
          const meta=chart.getDatasetMeta(0);
          meta.data.forEach((point,index)=>{
            const value=dataset.data[index];
            if(value==null||!point)return;
            ctx.save();
            ctx.fillStyle="#b8872a";
            ctx.font="700 11px sans-serif";
            ctx.textAlign="center";
            ctx.textBaseline="bottom";
            ctx.fillText((value/10000).toFixed(0)+"만",point.x,point.y-8);
            ctx.restore();
          });
        });

    };

    // 교습비 차트: calcStudentsPerSlot 기반으로 분류별 집계 (정규/특강 토글 반영, 특강은 동일분류 중복반영 방지)
    const chartSrc=isSpecialStat?"special":"main";
    const chartCats=isSpecialStat?CATS2:CATS;
    const chartCC=isSpecialStat?CC2:CC;
    const slotRows=calcStudentsPerSlot(chartSrc);

      const seen={};
      slotRows.forEach(r=>{
        const key=r.name+"|"+r.cat+"|"+(r.round||"1");
        if(seen[key])return;
        seen[key]=true;
        if(!catFeeMap[r.cat])catFeeMap[r.cat]=0;
        catFeeMap[r.cat]+=r.free?0:r.fee;
      });
    } else {
      slotRows.forEach(r=>{
        if(!catFeeMap[r.cat])catFeeMap[r.cat]=0;
        catFeeMap[r.cat]+=r.free?0:r.fee;
      });
    }
    const grandTotal=Object.values(catFeeMap).reduce((a,b)=>a+b,0);
    const feeData=chartCats.map(c=>({label:c.label,val:catFeeMap[c.key]||0,color:CHART_MUTED_COLORS[c.key]?.t||chartCC[c.key].t,bg:CHART_MUTED_COLORS[c.key]?.bg||chartCC[c.key].bg})).filter(d=>d.val>0).sort((a,b)=>b.val-a.val);
    chartInst.push(new Chart(feeCanvas,{type:"bar",data:{labels:feeData.map(d=>d.label),datasets:[{label:"교습비 합계",data:feeData.map(d=>d.val),backgroundColor:feeData.map(d=>d.bg),borderColor:feeData.map(d=>d.color),borderWidth:2,borderRadius:6}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,devicePixelRatio:Math.max(window.devicePixelRatio||1,2),layout:{padding:{right:75}},plugins:{legend:{display:false},title:{display:true,text:"분류별 교습비 비중 (높은순)  |  합계: "+(grandTotal/10000).toFixed(0)+"만원",font:{size:14,weight:"bold"},color:"#2c2c2c"}},scales:{x:{beginAtZero:true,ticks:{callback:v=>v===0?"0":(v/10000).toFixed(0)+"만",font:{size:11},color:"#555"},grid:{color:"#e5e0d3"}},y:{grid:{display:false},ticks:{font:{size:12},color:"#555"}}}},plugins:[barLabelPlugin((v,t)=>(v/10000).toFixed(0)+"만 ("+(grandTotal>0?Math.round(v/grandTotal*100):0)+"%)")]}));

    const catHours=calcCategoryHours(chartSrc);
    const hourData=chartCats.map(c=>({label:c.label,val:catHours[c.key]||0,color:CHART_MUTED_COLORS[c.key]?.t||chartCC[c.key].t,bg:CHART_MUTED_COLORS[c.key]?.bg||chartCC[c.key].bg})).filter(d=>d.val>0)
      .sort((a,b)=>b.val-a.val);
    const totalHours=Object.values(catHours).reduce((a,b)=>a+b,0);
    chartInst.push(new Chart(hourCanvas,{type:"bar",data:{labels:hourData.map(d=>d.label),datasets:[{label:"주간 교습시간",data:hourData.map(d=>d.val),backgroundColor:hourData.map(d=>d.bg),borderColor:hourData.map(d=>d.color),borderWidth:2,borderRadius:6}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,devicePixelRatio:Math.max(window.devicePixelRatio||1,2),layout:{padding:{right:75}},plugins:{legend:{display:false},title:{display:true,text:"분류별 주간 교습시간 (높은순)  |  합계: "+totalHours+"h",font:{size:14,weight:"bold"},color:"#2c2c2c"}},scales:{x:{beginAtZero:true,ticks:{callback:v=>v+"h",font:{size:11},color:"#555"},grid:{color:"#e5e0d3"}},y:{grid:{display:false},ticks:{font:{size:12},color:"#555"}}}},plugins:[barLabelPlugin((v,t)=>v+"h ("+(t>0?Math.round(v/t*100):0)+"%)")]}));

    if(!isSpecialStat&&barCanvas){
      const daily=calcDailyRevenue();
      const validVals=daily.map(d=>d.total).filter(v=>v!=null);
      const minV=validVals.length?Math.min(...validVals):0;
      const maxV=validVals.length?Math.max(...validVals):5000000;
      const padding=(maxV-minV)||500000;
      const yMin=Math.max(0,Math.floor((minV-padding*0.5)/100000)*100000);
      const yMax=Math.ceil((maxV+padding*0.5)/100000)*100000;
      const endLabelDate=new Date(now.getFullYear(),now.getMonth()+1,1);
      chartInst.push(new Chart(barCanvas,{type:"line",data:{labels:daily.map(d=>d.label),datasets:[{label:"교습비",data:daily.map(d=>d.total),borderColor:"#b8872a",backgroundColor:"rgba(184,135,42,.06)",borderWidth:4,pointBackgroundColor:"#b8872a",pointRadius:0,pointHoverRadius:5,tension:0,fill:false,spanGaps:true}]},options:{responsive:true,maintainAspectRatio:false,devicePixelRatio:Math.max(window.devicePixelRatio||1,2),layout:{padding:{top:24,right:36}},plugins:{legend:{display:false},title:{display:true,text:"교습비 변동 추이 (2026.6월 ~ "+endLabelDate.getFullYear()+"."+(endLabelDate.getMonth()+1)+"월)",font:{size:14,weight:"bold"},color:"#2c2c2c"},tooltip:{mode:"index",intersect:false,callbacks:{label:ctx=>ctx.raw==null?"":(ctx.raw/10000).toFixed(0)+"만원"}}},scales:{y:{min:yMin,max:yMax,ticks:{callback:v=>(v/10000).toFixed(0)+"만",font:{size:11},color:"#555"},grid:{color:"#e5e0d3"}},x:{grid:{display:false},ticks:{font:{size:11},maxRotation:0,autoSkip:true,maxTicksLimit:13,color:"#555"}}}},plugins:[lastLabelPlugin]}));
    }
  },60);
  return wrap;
}

  leftGroup.appendChild(tabNav);
  hdr.appendChild(leftGroup);

  // ── 우측: 저장상태 · 블로그 · 학생수(수강생) · 검색 · 기타기능 (같은 아래라인, 왼쪽과 같은 줄) ──
  const row2=D({style:{display:"flex",alignItems:"flex-end",flexWrap:"wrap",gap:"10px",marginLeft:"auto",opacity:.88}});
  const ROW2_H="30px";

  const badge=Sp({className:"save-badge",id:"syncBadge",style:{height:ROW2_H,display:"inline-flex",alignItems:"center",boxSizing:"border-box",padding:"0 10px"}},[S.saveStatus||""]);
  applyBadgeStyle(badge,S.saveStatus);
  row2.appendChild(badge);

  row2.appendChild(Bt({className:"btn no-print",style:{background:"#03C75A",color:"#fff",height:ROW2_H,padding:"0 16px",boxSizing:"border-box",display:"inline-flex",alignItems:"center"},onClick:()=>window.open("https://m.blog.naver.com/easy-ssaem?tab=1","_blank")},["📝 블로그"]));

  const pillsWrap=D({className:"hdr-pill-group no-print"});
  const LEVEL_CLASS={초등:"blue",중등:"green",고등:"amber"};
  hdrLevelCounts.forEach(({lv,cnt})=>{
    pillsWrap.appendChild(D({className:"hdr-pill "+LEVEL_CLASS[lv],onClick:()=>openLevelModal(lv)},[Sp({},[lv]),Sp({className:"pv"},[cnt+"명"])]));
  });
  pillsWrap.appendChild(D({className:"hdr-pill special",onClick:()=>openSpecialLevelModal()},[Sp({},["🏖 특강"]),Sp({className:"pv"},[hdrSpecialCount+"명"])]));
  row2.appendChild(pillsWrap);

  row2.appendChild(renderSearchBar());

  // 기타기능: 내보내기 · 인쇄 · 기본 교습비를 드롭다운 메뉴로 묶음
  const otherWrap=D({className:"no-print",style:{position:"relative"}});
  const otherBtn=Bt({className:"btn btn-ghost",style:{height:ROW2_H,padding:"0 16px",boxSizing:"border-box",display:"inline-flex",alignItems:"center"},onClick:(e)=>{e.stopPropagation();S.hdrOtherOpen=!S.hdrOtherOpen;render();}},["⋯ 기타기능"]);
  otherWrap.appendChild(otherBtn);
  if(S.hdrOtherOpen){
    const menu=D({style:{position:"absolute",top:"38px",right:"0",zIndex:"60",background:"#fff",border:`1px solid ${BORDER}`,borderRadius:"10px",boxShadow:"0 8px 24px rgba(0,0,0,.15)",overflow:"hidden",minWidth:"160px"}});
    const menuItem=(label,onClick)=>{
      const item=D({style:{padding:"10px 16px",fontSize:"13px",fontWeight:"700",color:TM,cursor:"pointer",whiteSpace:"nowrap"}},[label]);
      item.addEventListener("mouseenter",()=>item.style.background="#f5edd8");
      item.addEventListener("mouseleave",()=>item.style.background="transparent");
      item.addEventListener("click",()=>{S.hdrOtherOpen=false;onClick();});
      return item;
    };
    menu.appendChild(menuItem("📤 내보내기",openExportModal));
    menu.appendChild(menuItem("🖨️ 인쇄",()=>{
      const doPrint=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()));
      if(S.tab!=="tt"){S.tab="tt";render();doPrint();}else doPrint();
    }));
    menu.appendChild(menuItem("⚙️ 기본 교습비",openFeeModal));
    otherWrap.appendChild(menu);
  }
  row2.appendChild(otherWrap);

  hdr.appendChild(row2);
  root.appendChild(hdr);

  const mainEl=h("main",{});

  if(S.tab==="tt")mainEl.appendChild(renderTT());
  else if(S.tab==="att")mainEl.appendChild(renderAtt());
  else mainEl.appendChild(renderChart());

  root.appendChild(mainEl);

  // 출결 탭(정규): 헤더+분류별보기 영역이 실제로 차지하는 높이를 측정해서
  // 출결표 요일 헤더행이 그 바로 아래에 정확히 이어붙어 고정되도록 설정한다.
  // (offsetTop은 스크롤된 상태에서 sticky 요소 기준 부정확할 수 있어, 높이값만 더해서 계산)
  if(S.tab==="att"&&(S.attView||"main")==="main"){
    const hdrEl0=document.querySelector("header");
    const hdrH0=hdrEl0?hdrEl0.offsetHeight:96;
    const groupWrap=document.getElementById("attStickyGroupWrap");
    if(groupWrap){
      const offset=hdrH0+groupWrap.offsetHeight;
      document.querySelectorAll("table.att-tbl thead th").forEach(th=>{th.style.top=offset+"px";});
    }
  }
  // 시간표 탭: 상단 고정영역(오늘수업/월별일정/시간표 헤더) 실제 높이만큼을 제외한
  // 나머지 공간을 시간표 그리드 스크롤 박스 높이로 정확히 맞춘다.
  if(S.tab==="tt"){
    const hdrEl=document.querySelector("header");
    const hdrH=hdrEl?hdrEl.offsetHeight:96;
    const ttStickyWrap=document.getElementById("ttStickyWrap");
    const stickyH=ttStickyWrap?ttStickyWrap.offsetHeight:0;
    const ttWrapEl=document.querySelector(".tt-wrap");
    if(ttWrapEl)ttWrapEl.style.maxHeight="calc(100vh - "+(hdrH+stickyH+20)+"px)";
  }

  scheduleAutoSave();
}

// ── 초기화 ───────────────────────────────────────────────
initLoad();
</script>
<script>
// ── PWA: 서비스 워커 등록 (홈 화면 설치 지원) ───────────────
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(err=>console.error("SW 등록 실패",err));
  });
}
</script>
</body>
</html>
